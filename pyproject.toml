[project]
name = "scambot"
version = "0.1.0"
description = "Telegram and WhatsApp bot that checks forwarded messages and media for misinformation and scams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "feedparser>=6.0.14",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.16.2",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "redis>=5.3.1,<6",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "tldextract>=5.4.0",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]
embeddings = ["sentence-transformers>=6.3.0"]
# Optional: reads embedded content credentials from images; the checks work without it.
c2pa = ["c2pa-python>=0.39.0"]
media = [
    "faster-whisper>=1.2.1",
    "lingua-language-detector>=2.2.0",
    "opencv-python-headless>=5.0.0.93",
    "scenedetect>=0.7.3",
]

# scenedetect needs OpenCV; the headless build (group "media") is used instead of the GUI one.
[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scambot"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scambot", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20",
    "SIM", "S", "PT", "ASYNC", "RUF", "PL",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["scambot"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["scambot", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["c2pa", "c2pa.*", "dateutil", "dateutil.*", "lxml", "lxml.*", "feedparser", "feedparser.*", "filetype", "filetype.*", "pytesseract", "pytesseract.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["scambot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
