[project]
name = "scambot"
version = "0.1.0"
description = "Telegram and WhatsApp bot that checks forwarded messages and media for misinformation and scams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scambot"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scambot", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20",
    "SIM", "S", "PT", "ASYNC", "RUF", "PL",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["scambot"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["scambot", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["scambot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
