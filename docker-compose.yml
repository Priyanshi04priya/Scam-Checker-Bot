# Local development services. The bot, API and worker run on the host with `uv run`; the
# checker server runs here (or on the host, see README.md).
name: scambot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scambot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scambot}
      POSTGRES_DB: ${POSTGRES_DB:-scambot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "scambot.mcp_server.server"]
    env_file:
      - path: .env
        required: false
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_ALLOWED_HOSTS: "mcp:*,localhost:*,127.0.0.1:*"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scambot}:${POSTGRES_PASSWORD:-scambot}@postgres:5432/${POSTGRES_DB:-scambot}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models:/models          # the embedding model is downloaded here on first start
      # Downloaded media is read from here. A containerised worker must mount the same volume;
      # a worker on the host needs the checker server on the host too, with the same MEDIA_DIR
      # (the directories are private to their user).
      - media:/var/lib/scambot/media
    ports:
      - "127.0.0.1:8001:8001"   # for the host-run worker in local development
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  models:
  media:
