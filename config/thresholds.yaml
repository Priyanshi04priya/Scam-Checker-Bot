# Time limits, size limits, score cut-offs, reply checks and LLM prices.
pipeline: {deadline_s: 90, analyze_timeout_s: 20, explanation_timeout_s: 20,
           mcp_connect_timeout_s: 5, max_text_chars: 8000}
entities: {max_per_kind: 20, expand_timeout_s: 5, max_redirects: 5}
scam:
  signal_min: 0.40          # below this combined score the signal is "none"
  llm_cap: 0.85             # the most the model alone can contribute
  llm_timeout_s: 15
  min_span_chars: 3
  max_llm_spans: 5
  max_spans_per_name: 3
  max_text_chars: 8000
  max_reputation_urls: 20
  safe_browsing_timeout_s: 5
  fuzzy: {max_distance_short: 1, max_distance_long: 2, short_brand_max_len: 6, min_token_len: 4}
factcheck:
  max_claims: 3
  max_claim_chars: 300
  top_k: 8                       # nearest neighbours and full-text matches per claim
  rrf_k: 60                      # reciprocal rank fusion constant
  max_candidates: 5              # fused candidates shown to the relevance check
  api_page_size: 10
  api_timeout_s: 5
  index_timeout_s: 4
  relevance_timeout_s: 12        # search (5) + relevance (12) stays inside the 20 s tool timeout
  confidence_rated: 0.90         # same claim, publisher's rating says false or misleading
  confidence_llm_polarity: 0.80  # same claim, rating unclear, the model reads it as false/misleading
  max_evidence: 3
provenance:
  old_media_days: 30
  max_image_side_px: 1600        # the image sent to the search API is shrunk to this
  jpeg_quality: 85
  vision_timeout_s: 8
  max_results: 30                # web detection results asked for
  max_pages: 6                   # credible pages fetched
  pages_timeout_s: 8             # all page fetches together; 8 + 8 stays inside the 20 s tool timeout
  fetch: {timeout_s: 6, max_bytes: 1500000, max_redirects: 3}
  min_year: 1995                 # earlier or future page dates are ignored
  confidence_old_full: 0.85      # earliest credible page shows this very image, and it is old
  confidence_old_partial: 0.70
  confidence_clear_full: 0.80    # credible page found, not old (signal none)
  confidence_clear_partial: 0.65
  max_evidence: 3
  max_video_frames: 3            # a video's key frames searched on the web
caption:
  llm_timeout_s: 12
  max_text_chars: 1000
  max_field_chars: 200
  max_mismatches: 5
  confidence_date_and_place: 0.85
  confidence_single: 0.70
deepfake:
  timeout_s: 15                  # all frames together
  max_frames: 6
  min_side_px: 256
  min_bytes_per_pixel: 0.02      # below this the image is too compressed to judge
  max_upload_bytes: 8000000      # larger images are re-encoded as JPEG first
  signal_min: 0.50               # score at or above this gives likely_synthetic (the verdict rule still needs 0.85)
  max_evidence: 2
  max_concurrency: 3             # pictures scored at the same time
voice:
  timeout_s: 17                  # whole check; inside the 20 s tool timeout
  window_s: 10                   # the longest stretch of audio analysed
  min_speech_s: 3.0              # less speech than this is inconclusive
  min_silence_ms: 500
  signal_min: 0.60               # score at or above this gives likely_synthetic (the verdict rule still needs 0.75)
  max_wav_bytes: 20000000
  spoof_labels: [fake, spoof, spoofed, deepfake, synthetic, ai, generated]
  max_evidence: 1
ingest:
  lookback_days: 3               # daily run looks back three days to cover missed runs
  max_api_pages: 3
  api_page_size: 50
  max_feed_items: 30
  fetch_timeout_s: 10
  max_page_bytes: 3000000
  per_host_delay_s: 1.0
  max_crawl_delay_s: 10
  embed_batch_size: 32
media:
  download_timeout_s: 15        # both download attempts together
  preprocess_timeout_s: 35      # OCR, speech-to-text and keyframes together
  language_timeout_s: 3
  pool_workers: 2               # threads for ffmpeg, Tesseract, Whisper and scene detection
  max_image_pixels: 50000000
  sweep_older_than_min: 45
  ocr: {timeout_s: 15, languages: eng+hin, min_word_conf: 60, min_chars: 3,
        upscale_below_px: 1000, max_side_px: 3000, max_video_frames: 3}
  stt: {timeout_s: 30, window_s: 60, max_input_s: 600, beam_size: 1,
        min_silence_ms: 500, ffmpeg_timeout_s: 15, min_language_prob: 0.5}
  keyframes: {timeout_s: 15, max_keyframes: 6, fallback_frames: 3, scan_limit_s: 180,
              scene_threshold: 27.0, max_width_px: 1280, ffmpeg_timeout_s: 10}
reply:
  summary_max_chars: 600
  max_sources: 3
  banned_terms: [perceptual hash, phash, c2pa, exif, metadata, api, json, regex, llm, model, checker, confidence score, mcp, punycode, homoglyph, embedding, pipeline]
  genuine_terms: [genuine, authentic, is true, is real, completely safe, 100% safe, सच है, असली है, पूरी तरह सुरक्षित]
limits: {rate_per_hour: 20, rate_window_s: 3600, config_cache_s: 60}
cache:
  verdict_window_days: 7
  phash_max_distance: 8
  phash_candidates: 500          # newest recent image rows compared when not on PostgreSQL
  inconclusive_ttl_s: 3600       # an inconclusive checker result is kept this long at most
  checker_ttl_s:                 # seconds; every tool must be present
    analyze_scam_patterns: 21600
    fact_check_claim: 21600
    check_provenance: 604800
    check_caption_context: 86400
    detect_deepfake: 604800
    detect_voice_clone: 604800
retention: {days: 90}
llm_prices_usd_per_mtok:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-opus-4-8: {input: 5.00, output: 25.00}   # a possible refusal-fallback model
