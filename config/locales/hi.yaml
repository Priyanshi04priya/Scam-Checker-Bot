    no_issues: कोई समस्या नहीं मिली
    could_not_verify: पुष्टि नहीं हो सकी
  explanations:
    likely_scam: "इस संदेश में धोखाधड़ी के आम संकेत हैं: {signals}। किसी नंबर पर कॉल न करें, लिंक पर क्लिक न करें, पैसे न भेजें और OTP किसी को न बताएं। संस्था से केवल उसकी आधिकारिक वेबसाइट या हेल्पलाइन से संपर्क करें।"
    false_misleading: "एक फ़ैक्ट-चेक में यह दावा झूठा या भ्रामक पाया गया। कृपया इसे आगे न भेजें।"
    old_or_out_of_context: "यह सामग्री असली लगती है, पर पुरानी है या अपने मूल संदर्भ से अलग शेयर की गई है। आगे भेजने से पहले मूल स्रोत देखें।"
    possibly_ai: "यह सामग्री AI टूल से बनाई या बदली गई हो सकती है। यह पक्का नहीं है, इसलिए सावधानी रखें।"
    no_issues: "हमें इस संदेश में चेतावनी के संकेत नहीं मिले। इससे यह साबित नहीं होता कि यह सच है, इसलिए सावधान रहें।"
    could_not_verify: "उपलब्ध जाँचों से हम इस संदेश की पुष्टि नहीं कर सके। सावधानी रखें और किसी आधिकारिक स्रोत से पुष्टि करें।"
