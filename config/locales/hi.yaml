# Fixed user-facing strings in Hindi.
# Every language file must have exactly the same keys; the service refuses to start otherwise.

commands:
  start: |-
    नमस्ते! मैं फ़ॉरवर्ड किए गए संदेशों में धोखाधड़ी (स्कैम) और गलत जानकारी की जाँच करता हूँ।

    मुझे कोई संदेश फ़ॉरवर्ड करें, या टेक्स्ट, फ़ोटो, वीडियो, वॉइस नोट या ऑडियो भेजें। मैं जोखिम का स्तर, एक छोटी व्याख्या और सबूत के लिंक के साथ जवाब देता हूँ।

    मैं क्या रखता हूँ: आपकी यूज़र आईडी का हैश किया हुआ रूप, आपकी भेजी गई चीज़ों के फ़िंगरप्रिंट (हैश), मिले हुए दावे और नतीजा — अधिकतम 90 दिनों तक। मीडिया फ़ाइलें एक घंटे के अंदर हटा दी जाती हैं।

    कमांड: इस्तेमाल का तरीका जानने के लिए /help, और आपके डेटा के बारे में जानने के लिए /privacy भेजें।
  help: |-
    इस बॉट का इस्तेमाल कैसे करें

    भेजें या फ़ॉरवर्ड करें:
    • टेक्स्ट
    • फ़ोटो, वीडियो, वॉइस नोट या ऑडियो — हर फ़ाइल 20 MB तक

    उदाहरण:
    • "आपका बैंक खाता बंद हो जाएगा, OTP बताइए" जैसा संदेश
    • किसी फ़ोटो के साथ फ़ॉरवर्ड हुआ कैप्शन
    • जल्दी पैसे माँगने वाला वॉइस नोट

    मैं पहले "जाँच हो रही है…" लिखता हूँ और फिर उसी संदेश में नतीजा दिखाता हूँ।

    /start — परिचय
    /privacy — आपके डेटा का इस्तेमाल कैसे होता है
  privacy: |-
    गोपनीयता सूचना

    • आपकी भेजी गई मीडिया फ़ाइलें जाँच के 1 घंटे के अंदर हटा दी जाती हैं।
    • हम केवल आपकी यूज़र आईडी का हैश किया हुआ रूप, आपकी भेजी गई चीज़ों के फ़िंगरप्रिंट (हैश), उनसे निकाले गए दावे, नतीजा और सबूत के लिंक रखते हैं। ये रिकॉर्ड 90 दिनों के बाद अपने-आप हटा दिए जाते हैं।
    • आपका नाम, फ़ोन नंबर और पूरा संदेश सेव नहीं किया जाता।
    • जाँच के लिए सामग्री केवल उन्हीं सेवाओं को भेजी जा सकती है जो उस जाँच के लिए ज़रूरी हैं: Anthropic (भाषा विश्लेषण), Google (फ़ैक्ट-चेक खोज, Safe Browsing और इमेज खोज) और Sightengine (AI से बनी तस्वीरों की पहचान)।
    • हम भारत के डिजिटल व्यक्तिगत डेटा संरक्षण अधिनियम, 2023 के सिद्धांतों का पालन करते हैं: सूचना, उद्देश्य की सीमा, न्यूनतम डेटा और अनुरोध पर डेटा हटाना।
  unknown: |-
    मैं यह कमांड नहीं पहचानता। मैं क्या कर सकता हूँ, यह जानने के लिए /help भेजें।

checking: "जाँच हो रही है…"

timeout: "माफ़ कीजिए, इस जाँच में बहुत समय लग गया। कृपया कुछ मिनट बाद संदेश फिर से भेजें।"

rejected:
  too_large: "यह फ़ाइल 20 MB से बड़ी है, इसलिए मैं इसकी जाँच नहीं कर सकता। कृपया छोटी फ़ाइल या स्क्रीनशॉट भेजें।"
  unsupported_type: "मैं इस तरह की फ़ाइल की जाँच नहीं कर सकता। कृपया टेक्स्ट, फ़ोटो, वीडियो, वॉइस नोट या ऑडियो भेजें।"
  unreadable: "मैं यह फ़ाइल खोल नहीं सका। कृपया इसे फिर से भेजें या स्क्रीनशॉट भेजें।"

