  - {name: Scroll.in, site: scroll.in}
  - {name: The Wire, site: thewire.in}
  - {name: Deccan Herald, site: deccanherald.com}
  - {name: The Tribune, site: tribuneindia.com}
  - {name: Mint, site: livemint.com}
  - {name: Business Standard, site: business-standard.com}
  - {name: Firstpost, site: firstpost.com}
  - {name: PTI, site: ptinews.com}
