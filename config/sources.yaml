  - {name: PIB, site: pib.gov.in}
# Ratings are matched in this order; the first rule with a matching term wins. English terms
# match whole words, Hindi terms anywhere in the rating.
ratings:
  - polarity: mixed
    terms: [half true, half-true, not entirely true, partly true, partly false, partially true, partially false, mostly true, mixture, mixed, आंशिक, आधा सच]
  - polarity: misleading
    terms: [misleading, missing context, out of context, lacks context, exaggerated, distorted, manipulated, altered, edited, satire, भ्रामक, गुमराह, संदर्भ से बाहर, तोड़-मरोड़]
  - polarity: "false"
    terms: ["false", fake, not true, not correct, not accurate, untrue, incorrect, wrong, baseless, hoax, fabricated, pants on fire, debunked, scam, गलत, ग़लत, झूठ, फर्जी, फ़र्ज़ी, फेक, असत्य, सच नहीं, सही नहीं]
  - polarity: "true"
    terms: ["true", correct, accurate, सही, सच, सत्य]
