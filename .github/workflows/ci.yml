name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Shell scripts
        run: shellcheck deploy/*.sh

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Evaluation smoke test
        run: |
          uv run python -m eval.run --help
          uv run python -m eval.run --mode offline --suite all --out /tmp/eval-ci --strict

      - name: Migrations render offline
        run: uv run alembic upgrade head --sql

  deploy-config:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Compose files render
        run: |
          cp deploy/prod.env.example .env
          cat >> .env <<'EOF'
          DOMAIN=bot.example.com
          ACME_EMAIL=ops@example.com
          POSTGRES_PASSWORD=ci-password
          REDIS_PASSWORD=ci-password
          TELEGRAM_BOT_TOKEN=000000:ci-token
          EOF
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Caddyfile is valid
        run: |
          docker run --rm -e DOMAIN=bot.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008

  image-build:
    name: Image build (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scambot-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker images scambot-app:ci
